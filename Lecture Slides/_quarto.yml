project:
  type: website
  output-dir: _site
  pre-render:
    - >-
      "../.venv/bin/python" "/Users/bradcannell/Desktop/Git/knowledge-workbench/_presentations/scripts/presentation_build_quiz_slides.py" .
  post-render:
    - >-
      sh "../_ai/tools/shell/full_render_only.sh" "../.venv/bin/python" "/Users/bradcannell/Desktop/Git/knowledge-workbench/_presentations/scripts/presentation_render.py" --site-output-dir _site
  render:
    - index.qmd
    - "Module 01 - Welcome and Overview/Introduction to Epidemiology/Introduction to Epidemiology.qmd"
    - "Module 02 - Epidemiologic Measures of Disease Occurrence/Measures of Disease Occurrence - Part 1/Measures of Disease Occurrence - Part 1.qmd"
    - "Module 02 - Epidemiologic Measures of Disease Occurrence/Measures of Disease Occurrence - Part 2/Measures of Disease Occurrence - Part 2.qmd"
    - "Module 03 - Disease Occurrence Data/Disease Occurrence Data/Disease Occurrence Data.qmd"
    - "Module 04 - Descriptive Epidemiology/Descriptive Epidemiology/Descriptive Epidemiology.qmd"
    - "Module 05 - Association and Causality/Association and Causality/Association and Causality.qmd"
    - "Module 06-07 - Analytic Epidemiology/Experimental and Cohort Studies/Experimental and Cohort Studies.qmd"
    - "Module 06-07 - Analytic Epidemiology/Case-Control Studies/Case-Control Studies.qmd"
    - "Module 06-07 - Analytic Epidemiology/Ecologic Studies and Confounding/Ecologic Studies and Confounding.qmd"
    - "Module 08 - Statistics Overview and Descriptive Statistics/Statistical Thinking and Describing Data/Statistical Thinking and Describing Data.qmd"
    - "Module 08 - Statistics Overview and Descriptive Statistics/Continuous Data Summaries and Graphs/Continuous Data Summaries and Graphs.qmd"
    - "Module 09 - Correlation - Reliability and Validity/Scatterplots and Correlation/Scatterplots and Correlation.qmd"
    - "Module 09 - Correlation - Reliability and Validity/Reliability Validity and Application/Reliability Validity and Application.qmd"
    - "Module 10 - Inferential Statistics—Estimation/Random Error and Confidence Intervals/Random Error and Confidence Intervals.qmd"
    - "Module 11 - Hypothesis Testing - Effect Size and Power/Hypothesis Testing/Hypothesis Testing.qmd"
    - "Module 12 - Testing Mean Differences/Comparing Means.qmd"
  # The leading slash anchors each path to the project root. Without it, Quarto
  # treats the entry as "**/assets/..." and also matches the logo symlinks in
  # the Module 06-07 deck folders. A full render then fails with "AlreadyExists"
  # because it copies a symlink into _site before the file it points to.
  resources:
    - "/assets/tcu-logo.svg"
    - "/assets/tcu-logo-purple.svg"

website:
  title: "APHS 20203 Lecture Slides"
  search: false

format:
  html:
    theme: cosmo
    toc: false
