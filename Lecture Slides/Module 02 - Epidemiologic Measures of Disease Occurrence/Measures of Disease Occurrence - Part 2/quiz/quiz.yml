# Canonical, platform-independent quiz source.
#
# This file is the single source of truth for interactive questions. It drives
# the Reveal.js slides, the QR-code participation prompts, and the printed
# low-tech fallback handout. Create matching Poll Everywhere activities from
# this source; make future changes here first, synchronize the activities, and
# rebuild with _ai/tools/python/build_quiz_slides.py.
#
# Schema
# ------
# session:
#   code                  short human-typable session code shown on every slide
#   participation_url     optional default URL encoded into each QR code; set
#                         this only after creating a real survey or poll
#   fallback              default low-tech fallback instruction (required)
#
# questions[]:
#   id                    required, unique, kebab-case; also becomes the
#                         quiz-slides/<id>.qmd partial filename
#   type                  multiple_choice | multiple_select | short_answer | word_cloud
#   prompt                required, the question text shown to participants
#   options               list of choices (required for choice types)
#   correct               1-based index (multiple_choice) or list of indices
#                         (multiple_select); omit for opinion/ungraded items
#   explanation           shown in speaker notes and after discussion
#   presentation_mode     anonymous | identified | pseudonymous
#   reveal_distribution   true | false — show the response distribution live
#   reveal_correct_answer immediately | after_discussion | never
#   participation_url     per-question override of session.participation_url
#   fallback              per-question override of session.fallback

session:
  code: 
  # Add a real Poll Everywhere participant-response URL before presenting.
  # Leaving it blank suppresses the QR code and "Respond here" link rather
  # than sending participants to a fake survey.
  fallback: >-
    Read the question aloud. For choice questions, take a show of hands for
    each option. For open-response questions, ask two or three volunteers to
    answer and record the key ideas on the whiteboard.

questions:
  # - id: counts
  #   type: multiple_choice
  #   prompt: >-
  #     Why not stop at counts?


  - id: describe
    type: multiple_choice
    prompt: >-
      The research question is, "Is breast cancer currently more common in
      Texas or Ohio?" Therefore, the goal of our analysis is...
    options:
      - to describe
      - to predict
      - to draw causal conclusions
    correct: 1
    explanation: >-
      At face value, without additional context or information, most
      epidemiologists would consider this a descriptive question. However, a
      case could also be made for prediction or causation.
    presentation_mode: anonymous
    reveal_distribution: true
    reveal_correct_answer: after_discussion
    participation_url: https://PollEv.com/multiple_choice_polls/tfzkZ1yt8g1LXFmmzxkQs/respond

  - id: incidence
    type: short_answer
    prompt: >-
      What do measures of incidence tell us about a disease or another outcome
      of interest?
    explanation: Risk of the outcome over a specified period of time.
    presentation_mode: anonymous
    reveal_distribution: true
    reveal_correct_answer: after_discussion
    participation_url: https://PollEv.com/free_text_polls/y3co0x28tEMFMJeLhEYYb/respond

  - id: prevalence
    type: short_answer
    prompt: >-
      What do measures of prevalence tell us about a disease or another outcome
      of interest?
    explanation: >-
      The frequency of existing cases of a disease or other condition in a
      given population at a particular point or during a specified period.
    presentation_mode: anonymous
    reveal_distribution: true
    reveal_correct_answer: after_discussion
    participation_url: https://PollEv.com/free_text_polls/CoUOHufRgcKn5MsYBf7Sm/respond

  - id: incidence-prevalence
    type: multiple_choice
    prompt: Which measure of event occurrence is better - incidence or prevalence?
    options:
      - Incidence
      - Prevalence
      - It depends
    correct: 3
    explanation: >-
      Incidence and prevalence are equally useful measures of event occurrence,
      but they answer different questions. Incidence answers questions about
      risk. Prevalence answers questions about disease burden and public health
      response.
    presentation_mode: anonymous
    reveal_distribution: true
    reveal_correct_answer: after_discussion
    participation_url: https://PollEv.com/multiple_choice_polls/nDVPt2R6BMylOmfAdA1rN/respond

  - id: incidence-rates
    type: short_answer
    prompt: >-
      Why do we sometimes calculate incidence rates instead of incidence
      proportions, which are arguably more intuitive for most people?
    explanation: >-
      To calculate an accurate incidence proportion, the population must be
      closed and all members must have complete follow-up. New people cannot
      enter during the study period, nobody can leave except through death, and
      data must be collected from everyone throughout the study. These
      conditions are rare in epidemiology.
    presentation_mode: anonymous
    reveal_distribution: true
    reveal_correct_answer: after_discussion
    participation_url: https://PollEv.com/free_text_polls/K0589tMCLsNQv2EBucx6I/respond

  # BEGIN AI-CREATED DRAFT REVIEW QUESTIONS — needs Brad's review.
  # Based on the updated Measures of Disease Occurrence Parts 1 and 2.
  # All numerical scenarios below are hypothetical teaching examples.
  # Add real Poll Everywhere response URLs only after creating matching activities.

  - id: review-ratio-proportion-percentage
    type: short_answer
    prompt: >-
      In a survey today, 12 of 40 students report riding a bicycle to campus; 28 do not. Calculate the ratio of bicycle riders to nonriders, the proportion who ride, and the percentage who ride.
    explanation: >-
      Riders to nonriders = 12/28 = 3/7, or 3:7: three riders for every seven nonriders. The proportion who ride is 12/(12+28) = 12/40 = 0.30. The percentage is 0.30 × 100 = 30%. The ratio compares riders with nonriders; the proportion and percentage compare riders with all surveyed students. All three descriptions refer to this survey today.
    presentation_mode: anonymous
    reveal_distribution: true
    reveal_correct_answer: after_discussion

  - id: review-prevalence-and-incidence
    type: multiple_choice
    prompt: >-
      On January 1, 2026, 20 of 200 adults have hypertension. During 2026, 36 of the remaining 180 develop it. Everyone is followed for the full year. What are the January 1 prevalence proportion and the 2026 incidence proportion, respectively?
    options:
      - "10% and 18%"
      - "10% and 20%"
      - "28% and 20%"
      - "20% and 10%"
    correct: 2
    explanation: >-
      January 1 prevalence = 20/200 = 0.10, or 10%, because it describes existing cases among all adults at that time. The 2026 incidence proportion = 36/180 = 0.20, or 20%, because it describes new cases among adults initially at risk. The 20 adults who already had hypertension cannot become new cases of hypertension during follow-up. Dividing 36 by 200 incorrectly includes those existing cases in the incidence denominator.
    presentation_mode: anonymous
    reveal_distribution: true
    reveal_correct_answer: after_discussion

  - id: review-person-time-rate
    type: short_answer
    prompt: >-
      In a 6-month study of first ankle injuries, four athletes contribute 2, 4, 6, and 6 months at risk. The first two develop an injury when their time at risk ends; the other two remain injury-free. Calculate total person-time and the incidence rate per 100 person-months.
    explanation: >-
      Total person-time = 2 + 4 + 6 + 6 = 18 person-months. There are two first injuries, so the incidence rate = (2/18) × 100 = approximately 11.1 first ankle injuries per 100 person-months at risk during the 6-month study. Time after a first injury does not contribute to the denominator for that first injury. Eighteen person-months is accumulated time across four athletes, not an 18-month study. The rate is not a statement that 11.1% of athletes were injured.
    presentation_mode: anonymous
    reveal_distribution: true
    reveal_correct_answer: after_discussion

  - id: review-odds-interpretation
    type: multiple_choice
    prompt: >-
      In a survey today, 30 residents have asthma and 90 do not. Which statement correctly interprets the prevalence odds of asthma?
    options:
      - "There is 1 resident with asthma for every 3 without asthma."
      - "There is 1 resident with asthma for every 4 without asthma."
      - "There are 3 residents with asthma for every 1 without asthma."
      - "There is 1 resident with asthma for every 3 residents in total."
    correct: 1
    explanation: >-
      The prevalence odds = 30/90 = 1/3, or 1:3. The denominator contains residents without asthma, so there is one resident with asthma for every three without it. The corresponding prevalence proportion is 30/(30+90) = 30/120 = 0.25, or 25%. One with asthma out of every four residents in total is a probability or proportion statement; it is different from one with asthma for every four without it.
    presentation_mode: anonymous
    reveal_distribution: true
    reveal_correct_answer: after_discussion

  - id: review-odds-to-probability
    type: short_answer
    prompt: >-
      Among people tested at a clinic today, the odds of a positive test are 3:2. What probability of a positive test corresponds to these odds? Show the calculation and express the answer as a percentage.
    explanation: >-
      Odds of 3:2 mean three positive tests for every two negative tests. Therefore, the probability of a positive test = 3/(3+2) = 3/5 = 0.60, or 60%. Equivalently, the numeric odds are 3/2 = 1.5, and probability = odds/(1+odds) = 1.5/2.5 = 0.60. Odds can exceed 1; a probability of 150% would be impossible. This describes test results among the people tested today, not disease frequency in the entire community.
    presentation_mode: anonymous
    reveal_distribution: true
    reveal_correct_answer: after_discussion

  - id: review-odds-ratio
    type: multiple_choice
    prompt: >-
      Two groups are surveyed for insomnia today. The prevalence odds are 2.0 in Group A and 0.5 in Group B. Which statement correctly compares the groups?
    options:
      - "Group A has twice Group B's odds of insomnia."
      - "Group A has four times Group B's probability of insomnia."
      - "Group A has four times Group B's odds of insomnia."
      - "Group A has one-fourth of Group B's odds of insomnia."
    correct: 3
    explanation: >-
      The odds ratio comparing A with B = 2.0/0.5 = 4. Group A has four times the odds of insomnia compared with Group B today. The corresponding probabilities are 2/(1+2) = 2/3 in A and 0.5/(1+0.5) = 1/3 in B, so the probability ratio is 2, not 4. Comparing odds is one reason we calculate them, but an odds ratio must be interpreted using the word odds. This comparison alone does not establish a cause of insomnia.
    presentation_mode: anonymous
    reveal_distribution: true
    reveal_correct_answer: after_discussion

  - id: review-why-adjust-rates
    type: multiple_choice
    prompt: >-
      Two counties have the same death rates within each age group in 2026, but County A has a larger share of older residents and a higher crude death rate. What does applying the same standard age distribution to both counties accomplish?
    options:
      - "It changes the actual number of deaths recorded in each county."
      - "It removes every possible source of bias from the comparison."
      - "It makes each county's age-specific death rates equal to its crude rate."
      - "It compares summary death rates using the same age mix."
    correct: 4
    explanation: >-
      Direct age adjustment applies the same age weights to each county's age-specific rates. With identical age-specific rates and identical weights, the adjusted rates will be equal. The crude rates differ here because the counties have different age distributions. Adjustment changes the summary used for comparison, not the observed deaths, and it does not automatically remove other differences, measurement problems, or bias.
    presentation_mode: anonymous
    reveal_distribution: true
    reveal_correct_answer: after_discussion

  - id: review-adjusted-rate-calculation
    type: short_answer
    prompt: >-
      A county's 2026 death rates are 4 per 1,000 residents under age 65 and 24 per 1,000 residents ages 65+. Use a standard population that is 75% under 65 and 25% ages 65+. Calculate and interpret the directly age-adjusted death rate.
    explanation: >-
      Adjusted rate = (0.75 × 4) + (0.25 × 24) = 3 + 6 = 9 deaths per 1,000 standard population per year. This is the summary death rate expected if the county retained its 2026 age-specific rates but had the standard population's age mix. The weights sum to 1. The result is a weighted comparison measure; it does not claim that exactly nine deaths were observed in a particular group of 1,000 residents.
    presentation_mode: anonymous
    reveal_distribution: true
    reveal_correct_answer: after_discussion

  - id: review-mortality-rate
    type: multiple_choice
    prompt: >-
      During 2026, a county records 360 deaths from all causes and has a midyear population of 90,000. Which statement correctly reports its crude mortality rate per 1,000 residents?
    options:
      - "0.4 deaths per 1,000 residents during 2026."
      - "4 deaths per 1,000 residents during 2026."
      - "4 deaths per 1,000 people who died during 2026."
      - "40 deaths per 1,000 residents during 2026."
    correct: 2
    explanation: >-
      Crude mortality rate = (360/90,000) × 1,000 = 4 deaths per 1,000 residents during 2026. The numerator counts new death events during the year, and the denominator is the midyear population. Midyear population multiplied by one year approximates the population's person-time. The measure is crude because it includes all causes across the whole population, without adjustment. A proportion of cases who die from a particular disease would require a different denominator.
    presentation_mode: anonymous
    reveal_distribution: true
    reveal_correct_answer: after_discussion

  - id: review-birth-and-fertility-rates
    type: short_answer
    prompt: >-
      During 2026, a town records 210 live births. Its midyear population is 14,000, including 3,000 women ages 15–44. Calculate the crude birth rate and the U.S. general fertility rate, each per 1,000. Explain why the answers differ.
    explanation: >-
      Crude birth rate = (210/14,000) × 1,000 = 15 live births per 1,000 residents during 2026. General fertility rate = (210/3,000) × 1,000 = 70 live births per 1,000 women ages 15–44 during 2026. Both use all live births during the year as the numerator under the U.S. convention taught here; the denominators differ. The crude birth rate relates births to the whole population, while the general fertility rate uses women ages 15–44. Neither result is simply the percentage of all residents who gave birth.
    presentation_mode: anonymous
    reveal_distribution: true
    reveal_correct_answer: after_discussion

  # END AI-CREATED DRAFT REVIEW QUESTIONS.


  - id: other-questions
    type: short_answer
    prompt: What questions do you have?
    presentation_mode: anonymous
    reveal_distribution: false
    reveal_correct_answer: never
    fallback: >-
      Ask students to share remaining questions aloud and record unresolved
      topics for follow-up.
    participation_url: https://PollEv.com/free_text_polls/3lHepUui77dAHrGfbs2sQ/respond
